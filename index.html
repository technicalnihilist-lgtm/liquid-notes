<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Liquid Notes</title>
<meta name="description" content="Liquid Notes — a liquid-glass note taking app that works offline.">
<meta name="theme-color" content="#dfe6ff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b1030" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Liquid Notes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="bg" aria-hidden="true">
  <i class="orb o1" data-d="34"></i>
  <i class="orb o2" data-d="-22"></i>
  <i class="orb o3" data-d="46"></i>
  <i class="orb o4" data-d="-16"></i>
</div>

<main class="stage">
  <div class="tilt" id="tilt">
    <section class="win" id="win" aria-label="Liquid Notes">
      <header class="bar">
        <div class="title" data-z="0.5">Notes</div>
        <div class="tools">
          <button class="ib" id="bInstall" aria-label="Install app" hidden>⤓</button>
          <button class="ib" id="bNew" aria-label="New note">✎</button>
          <button class="act" id="bSave" aria-label="Save note">Save</button>
          <button class="act primary" id="bDone" aria-label="Save and close">Done</button>
          <button class="ib" id="bMore" aria-label="Settings" aria-expanded="false">•••</button>
        </div>
      </header>

      <div class="body">
        <aside class="pane side" data-z="0.35">
          <input id="q" type="search" placeholder="Search notes" aria-label="Search notes" autocomplete="off">
          <ul id="list" aria-label="Note list"></ul>
          <div class="hint">Hold a note to delete it</div>
        </aside>

        <section class="pane ed" data-z="0.15">
          <div class="ed-head">
            <input id="ti" placeholder="Title" aria-label="Note title" autocomplete="off">
            <div class="state" id="state" role="status" aria-live="polite">Not saved yet</div>
          </div>
          <textarea id="tx" placeholder="Write your note…" aria-label="Note body" spellcheck="true"></textarea>
          <div class="meta">
            <span id="meta"></span>
            <span id="stats"></span>
          </div>
        </section>
      </div>

      <div class="menu" id="menu" role="dialog" aria-label="Settings" aria-modal="false"></div>
    </section>
  </div>
</main>

<button class="home" id="home" aria-label="Open Notes">
  <svg viewBox="0 0 54 54" aria-hidden="true">
    <rect x="12" y="11" width="30" height="32" rx="5" fill="#fff" opacity=".92"/>
    <path d="M18 20h18M18 27h18M18 34h10" stroke="#e0a21a" stroke-width="2.5" stroke-linecap="round"/>
  </svg>
</button>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
